# Render Blueprint.
services:
  # Public offline demo (synthetic footage, no API key).
  - type: web
    name: tanyacctv-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile

  # The real website with live search. Password-protected; data lives on the disk.
  - type: web
    name: tanyacctv-live
    runtime: docker
    plan: starter
    dockerfilePath: ./deploy/Dockerfile.live
    disk:
      name: tanya-data
      mountPath: /Users/jasonlee
      sizeGB: 2
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TANYA_SITE_PASSWORD
        sync: false
